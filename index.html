<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, viewport-fit=cover">
<title>Scoop Journal</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FAF6EE">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Scoop Journal">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<!-- Supabase client library (UMD build, exposes window.supabase) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

<script type="module">
  // Small helper the app modules use to turn a stored storage path into a
  // displayable URL. Kept here so app.js doesn't need to re-import the
  // client just for this.
  import { supabase } from './js/supabase-client.js';
  window.__photoUrl = (path) => supabase.storage.from('photos').getPublicUrl(path).data.publicUrl;
</script>
<script type="module" src="js/app.js"></script>

<script>
  // Skip the service worker during local development — caching the app
  // shell is great in production, but it means every edit needs a manual
  // cache-bust locally, which is more confusing than it's worth while
  // you're actively changing files.
  const isLocalDev = ['localhost', '127.0.0.1'].includes(location.hostname);
  if ('serviceWorker' in navigator && !isLocalDev) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch((err) => console.warn('SW registration failed:', err));
    });
  } else if ('serviceWorker' in navigator && isLocalDev) {
    // Also unregister any service worker left over from earlier testing.
    navigator.serviceWorker.getRegistrations().then((regs) => regs.forEach((r) => r.unregister()));
  }
</script>
</body>
</html>
